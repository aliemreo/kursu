# Builds and runs the backend and the frontend together (staging, WBS-6.2).
# The database is not part of it: the backend connects to Neon through DATABASE_URL in .env.
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCKS: "true"
    restart: unless-stopped
    ports:
      - "3000:80"
