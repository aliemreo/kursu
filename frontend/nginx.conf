server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker'ın dahili DNS sunucusu. Backend adı istek geldiğinde çözümlenir,
    # böylece backend çalışmıyorken de Nginx başlayabilir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend'e proxy: /api/games -> http://backend:8000/games
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Vite'ın hash'li dosyaları uzun süre önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html her zaman yeniden doğrulansın; yeni sürümler hemen yüklensin.
    location = /index.html {
        expires -1;
    }

    # React Router için SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}