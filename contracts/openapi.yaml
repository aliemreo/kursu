openapi: 3.1.0
info:
  title: Kürsü API
  version: 0.1.0-draft
  description: >
    Draft contract for WBS-1.2. Field names and endpoints will be refined during the
    API contract work; any change is made here first, in the same pull request as the code.
    Game metrics are a configurable list, so their number and names are not fixed here.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: Account created }
        "409": { description: Email already registered }
  /auth/login:
    post:
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { description: Wrong email or password }
  /topics:
    get:
      summary: List playable debate topics
      responses:
        "200":
          description: Topic catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Topic" }
  /games:
    post:
      summary: Start a new game
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_count]
              properties:
                session_count: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
  /games/{game_id}:
    get:
      summary: Current game state, including metrics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: game_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "404": { description: Game not found or not owned by the player }
  /games/{game_id}/sessions/{session_no}/turns:
    post:
      summary: Submit the player's turn and receive the opponent's reply
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: game_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: session_no, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Player turn stored and opponent turn generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  player_turn: { $ref: "#/components/schemas/Turn" }
                  opponent_turn: { $ref: "#/components/schemas/Turn" }
        "409": { description: "Not the player's turn, or the session has ended" }
  /games/{game_id}/sessions/{session_no}/verdict:
    get:
      summary: Judge verdict for a finished session
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: game_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: session_no, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Verdict and the metric changes that were applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verdict" }
        "409": { description: Session not finished yet }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, example: ok }
        version: { type: string }
        environment: { type: string }
        llm_provider: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    Token:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
    Topic:
      type: object
      required: [id, title, motion]
      properties:
        id: { type: string }
        title: { type: string }
        motion: { type: string, description: The policy statement being debated }
        positions:
          type: array
          items: { type: string }
    Metric:
      type: object
      required: [id, name, value, min, max]
      properties:
        id: { type: string }
        name: { type: string }
        value: { type: number }
        min: { type: number }
        max: { type: number }
    Game:
      type: object
      required: [id, status, session_count, current_session, metrics]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, finished] }
        session_count: { type: integer }
        current_session: { type: integer }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        final_score: { type: [number, "null"] }
    Turn:
      type: object
      required: [id, speaker, text]
      properties:
        id: { type: string }
        speaker: { type: string, enum: [player, opponent] }
        text: { type: string }
        citations:
          type: array
          description: Only filled when retrieval grounding is enabled
          items: { type: string }
    JudgeQualitative:
      type: object
      description: Stage 1, transcript-level assessment
      required: [winner, victory_strength, narrative, categories]
      properties:
        winner: { type: string, enum: [player, opponent, draw] }
        victory_strength: { type: string, enum: [narrow, clear, decisive] }
        narrative: { type: string }
        categories:
          type: array
          description: Choices from the topic's predefined category options
          items:
            type: object
            required: [category_id, choice_id]
            properties:
              category_id: { type: string }
              choice_id: { type: string }
        evidence:
          type: array
          items:
            type: object
            properties:
              turn_id: { type: string }
              quote: { type: string }
    JudgeQuantitative:
      type: object
      description: Stage 2, bounded metric-change proposals
      required: [metric_deltas]
      properties:
        metric_deltas:
          type: array
          items:
            type: object
            required: [metric_id, delta]
            properties:
              metric_id: { type: string }
              delta: { type: number }
              reason: { type: string }
    Verdict:
      type: object
      required: [qualitative, quantitative, applied]
      properties:
        qualitative: { $ref: "#/components/schemas/JudgeQualitative" }
        quantitative: { $ref: "#/components/schemas/JudgeQuantitative" }
        applied:
          type: boolean
          description: False when validation rejected the proposal and the game state was kept
        rejection_reason: { type: [string, "null"] }
